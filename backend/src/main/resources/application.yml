spring:
  datasource:
    url: jdbc:mysql://${database_endpoint}:3306/${database_name}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    username: ${database_username}
    password: ${database_password}
    # url: ${DB_URL}
    # username: ${DB_USERNAME}
    # password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

spring.cloud.aws:
  region:
    static: ap-northeast-1  # 東京リージョンを固定で指定
  credentials:
    instance-profile: false 
  s3:
    region: ap-northeast-1

logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG

api:
  base-url: ${API_BASE_URL} #本番開発共通
  #uploaded-url: ${IMAGE_UPLOADED_URL} #開発環境のみ
  s3:
    bucket-name: ${s3_bucket_name} #本番環境のみ
  cloudfront:
    url: ${API_CLOUDFRONT_URL} #本番環境のみ

jwt:
  secret-key: ${jwt-secret-key:my_super_secret_key_for_jwt_auth_demo_app_32_chars} #本番開発共通

#小文字はSecret Managerから値を取得するもの